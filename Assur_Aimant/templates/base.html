{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AssurPredict{% endblock %}</title>
    {% tailwind_css %}
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

<!-- HEADER -->
<header class="bg-VERT text-GRIS shadow">
    <div class="max-w-5xl mx-auto flex justify-between items-center p-4">

        <h1 class="text-2xl font-bold">
            AssurPredict
        </h1>

        <nav class="space-x-4 text-sm">
            <a href="/" class="bg-white text-ORANGE font-bold text-lg px-3 py-1 rounded hover:bg-gray-100">Accueil</a>

            {% if user.is_authenticated %}
                <span>Bonjour {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Déconnexion</button>
                </form>

            {% else %}
                <a href="{% url 'login' %}" class="bg-white text-ORANGE font-bold text-lg px-3 py-1 rounded hover:bg-gray-100">
                    Se connecter
                </a>
            {% endif %}
        </nav>

    </div>
</header>

<!-- MAIN -->
<main class="bg-IVOIRE flex-1 flex items-center justify-center pt-[50px]"">

   

        

    

</main>

<div class="bg-IVOIRE text-center text-GRIS text-bold text-xl pt-[5px]"">
    
    {% block content %}
        {% endblock %}
</div>    

<!-- FOOTER -->
<footer class="bg-VERT text-center text-GRIS-500 text-sm p-4">
    © 2026 – AssurPredict
</footer>

</body>
</html>
