{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold mb-4">Créer un compte</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button
      type="submit"
      class="w-full mt-4 bg-blue-600 text-white py-2 rounded"
    >
      S’inscrire
    </button>
  </form>

  <p class="mt-4 text-sm text-center">
    Déjà un compte ?
    <a href="{% url 'login' %}" class="text-blue-600">Se connecter</a>
  </p>
</div>
{% endblock %}
