{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-[70vh]">
    <div class="bg-white p-8 rounded-lg shadow-lg border-4 border-ORANGE w-full max-w-md mx-4">
        <h2 class="text-2xl font-bold text-center mb-6 text-GRIS">Créer un compte</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-IVOIRE hover:bg-orange-600 text-ORANGE font-bold py-3 px-4 rounded mt-6">
                S'inscrire
            </button>
        </form>
        
        <p class="text-center mt-6 text-GRIS">
            Déjà un compte ?
            <a href="{% url 'login' %}" class="text-ORANGE hover:text-orange-600 font-semibold underline">Se connecter</a>
        </p>
    </div>
</div>
{% endblock %}
