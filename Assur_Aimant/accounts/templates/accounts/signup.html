{% extends "base.html" %}
{% block content %}
<div>
  <h2>Créer un compte</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit"class="bg-white text-gray-600 px-3 py-1 rounded hover:bg-gray-100">
      S’inscrire
    </button>
  </form>

  <p>
    Déjà un compte ?
    <a href="{% url 'login' %}"class="bg-white text-gray-600 px-3 py-1 rounded hover:bg-gray-100">Se connecter</a>
  </p>
</div>
{% endblock %}
