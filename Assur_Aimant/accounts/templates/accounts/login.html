{% extends "base.html" %}

{% block content %}
<div>
  <h2>Connexion</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="bg-white text-gray-600 px-3 py-1 rounded hover:bg-gray-100">
      Se connecter
    </button>
  </form>

  <p>
    Pas encore de compte ?
    <a href="{% url 'signup' %}"class="bg-white text-gray-600 px-3 py-1 rounded hover:bg-gray-100">Créer un compte</a>
  </p>
</div>
{% endblock %}
