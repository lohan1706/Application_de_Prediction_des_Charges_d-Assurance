{% extends "base.html" %}

{% block content %}
<div>
  <h2>Connexion</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">
      Se connecter
    </button>
  </form>

  <p>
    Pas encore de compte ?
    <a href="{% url 'signup' %}">Créer un compte</a>
  </p>
</div>
{% endblock %}
